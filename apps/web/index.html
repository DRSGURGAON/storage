<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Warehouse Operations</title>
    <meta
      name="description"
      content="Gate to gate: receipts, put-away, stock, dispatch, proof of delivery, billing and every document each step issues."
    />
    <!--
      Installability, not decoration. A phone can add this to its home
      screen from here, and a Play Store listing built as a Trusted Web
      Activity reads exactly these fields: without a manifest and a 512px
      maskable icon there is nothing for Android to install.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1f6feb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- An operational record is nobody's search result. -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
