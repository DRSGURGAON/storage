name: StorageBill Pro Android

# Builds the Android app bundle for the Play Store, and an APK for
# testing on a phone. Runs on demand, and on any push that touches the
# app, so a change that breaks the Android build is caught here rather
# than on release day.
on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Version name (e.g. 1.0.0). Blank uses pubspec.'
        required: false
      build_number:
        description: 'Version code (e.g. 3). Blank uses pubspec.'
        required: false
  push:
    branches: ['**']
    paths:
      - 'mobile/godown_book/**'
      - '.github/workflows/godown-book-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/godown_book

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Firebase configuration. Both secrets are optional: without them
      # the build still produces an installable artifact, but Phone
      # sign-in will not work in it, which the step says plainly rather
      # than failing later at runtime with no explanation.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GODOWN_BOOK_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written."
          else
            echo "::warning::No GODOWN_BOOK_GOOGLE_SERVICES_JSON secret - building without Firebase; phone sign-in will not work in this build."
            # A minimal placeholder so the Google Services plugin does
            # not fail the build outright.
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.drs.godownbook"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi

      - name: Write firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.GODOWN_BOOK_FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart
            echo "firebase_options.dart written."
          else
            echo "::warning::No GODOWN_BOOK_FIREBASE_OPTIONS_DART secret - keeping the placeholder; the app will show its 'Could not connect' screen."
          fi

      # Release signing. Without the keystore secrets the build falls
      # back to debug signing (see android/app/build.gradle.kts) - fine
      # for testing, not uploadable to Play.
      - name: Write the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GODOWN_BOOK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GODOWN_BOOK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GODOWN_BOOK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GODOWN_BOOK_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/godown-book.jks
            {
              echo "storeFile=godown-book.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Release keystore written."
          else
            echo "::warning::No GODOWN_BOOK_KEYSTORE_BASE64 secret - this build is debug-signed and cannot be uploaded to Play."
          fi

      - name: Build app bundle
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.build_name }}" ]; then
            ARGS="$ARGS --build-name=${{ github.event.inputs.build_name }}"
          fi
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            ARGS="$ARGS --build-number=${{ github.event.inputs.build_number }}"
          fi
          flutter build appbundle --release $ARGS

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: godown-book-appbundle
          path: mobile/godown_book/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: godown-book-apk
          path: mobile/godown_book/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Clean up secrets from the runner
        if: always()
        run: rm -f android/godown-book.jks android/key.properties
