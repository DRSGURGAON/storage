name: StorageBill Pro Android

# Builds the Android app bundle for the Play Store, and an APK for
# testing on a phone. Runs on demand, and on any push that touches the
# app, so a change that breaks the Android build is caught here rather
# than on release day.
on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Version name (e.g. 1.0.0). Blank uses pubspec.'
        required: false
      build_number:
        description: 'Version code (e.g. 3). Blank uses pubspec.'
        required: false
  push:
    branches: ['**']
    paths:
      - 'mobile/godown_book/**'
      - '.github/workflows/godown-book-android.yml'

# Publishing each build as a release needs write access to the
# repository's contents; nothing else does.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/godown_book

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Production Firebase configuration. Required, not optional: a
      # build without it installs and then cannot sign anybody in, and
      # every artifact here is published as a release, so failing now is
      # better than shipping one that looks fine and is not.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GODOWN_BOOK_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GODOWN_BOOK_GOOGLE_SERVICES_JSON is not set. See README, Firebase."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Write firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.GODOWN_BOOK_FIREBASE_OPTIONS_DART }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART" ]; then
            echo "::error::GODOWN_BOOK_FIREBASE_OPTIONS_DART is not set; lib/firebase_options.dart would stay the placeholder."
            exit 1
          fi
          printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      # Release signing. The Play upload key lives only in the secrets;
      # there is no key in the repository to fall back to.
      - name: Write the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GODOWN_BOOK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GODOWN_BOOK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GODOWN_BOOK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GODOWN_BOOK_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GODOWN_BOOK_KEYSTORE_BASE64 is not set; the build would not be release-signed."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/godown-book.jks
          {
            echo "storeFile=godown-book.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # What the secrets actually contain is checked here rather than
      # trusted: the wrong Firebase project, a leftover placeholder or a
      # missing key all produce an artifact that looks releasable. Only
      # the project id and package name are printed; neither is secret,
      # both are readable in any published APK.
      - name: Verify the release configuration
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          PROJECT = 'storagebill-pro'
          PACKAGE = 'com.drs.godownbook'
          problems = []

          services = json.loads(
              pathlib.Path('android/app/google-services.json').read_text())
          project = services.get('project_info', {}).get('project_id', '')
          if project != PROJECT:
              problems.append(
                  f'google-services.json names project {project!r}, expected {PROJECT!r}')

          packages = sorted({
              client.get('client_info', {})
                    .get('android_client_info', {})
                    .get('package_name', '')
              for client in services.get('client', [])
          })
          if PACKAGE not in packages:
              problems.append(
                  f'google-services.json has no client for {PACKAGE}; it has {packages}')

          # Only the android block ships here: CI builds an app bundle
          # and an APK, never the web app, and a flutterfire run for
          # android alone leaves the web block as the placeholder. That
          # is not a reason to refuse a Play build, so it is said and
          # not failed on.
          options = pathlib.Path('lib/firebase_options.dart').read_text()
          android = re.search(
              r'android\s*=\s*FirebaseOptions\((.*?)\);', options, re.S)
          if android is None:
              problems.append('firebase_options.dart has no android FirebaseOptions block')
          else:
              block = android.group(1)
              if 'REPLACE_WITH_FLUTTERFIRE_CONFIGURE' in block:
                  problems.append('the android block of firebase_options.dart is still the placeholder')
              elif PROJECT not in block:
                  problems.append(
                      f'the android block of firebase_options.dart does not name {PROJECT!r}')
          if 'REPLACE_WITH_FLUTTERFIRE_CONFIGURE' in options:
              print('::warning::firebase_options.dart still has a placeholder outside the '
                    'android block (the web app). Nothing published here uses it.')

          properties = pathlib.Path('android/key.properties')
          if not properties.exists():
              problems.append('android/key.properties is missing; the build would not be release-signed')
          else:
              named = dict(
                  line.split('=', 1)
                  for line in properties.read_text().splitlines()
                  if '=' in line
              )
              store = named.get('storeFile', '').strip()
              if not store:
                  problems.append('android/key.properties names no storeFile')
              elif not (pathlib.Path('android') / store).exists():
                  problems.append(
                      f'the keystore {store!r} named by key.properties is not beside it in android/')
          if pathlib.Path('android/dev-signing.jks').exists():
              problems.append('android/dev-signing.jks is back; a published build must not use a test key')

          for problem in problems:
              print(f'::error::{problem}')
          if problems:
              sys.exit(1)

          print(f'Firebase project: {project}')
          print(f'Android package:  {PACKAGE}')
          print('Signing:          release key from secrets')
          PY

      # Every build gets a version code higher than the last one (the
      # workflow run number), so a phone takes each new APK as an update
      # over the one before. The same number is compiled into the app and
      # shown under Settings, so "which build is this?" has an answer.
      - name: Build app bundle
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.build_name }}" ]; then
            ARGS="$ARGS --build-name=${{ github.event.inputs.build_name }}"
          fi
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            ARGS="$ARGS --build-number=${{ github.event.inputs.build_number }}"
          else
            ARGS="$ARGS --build-number=${{ github.run_number }}"
          fi
          echo "BUILD_ARGS=$ARGS" >> "$GITHUB_ENV"
          flutter build appbundle --release $ARGS --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Build APK
        run: flutter build apk --release $BUILD_ARGS --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Rename the APK by build number
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/storagebill-pro-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: storagebill-pro-aab-build-${{ github.run_number }}
          path: mobile/godown_book/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: storagebill-pro-apk-build-${{ github.run_number }}
          path: mobile/godown_book/build/app/outputs/flutter-apk/storagebill-pro-build-*.apk
          if-no-files-found: error

      # The bundle carries the run number in its name too, so a release
      # page holding several builds cannot be mistaken for one.
      - name: Rename the app bundle by build number
        run: |
          mv build/app/outputs/bundle/release/app-release.aab \
             "build/app/outputs/bundle/release/storagebill-pro-build-${{ github.run_number }}.aab"

      # Every build is also a GitHub release, tagged by its run number,
      # with BOTH the APK and the Play bundle attached. The repository is
      # public, so the app can read the latest release without a token
      # and offer the update from its own dashboard - and a phone
      # installs it over the old build because every build is signed
      # with the same key.
      #
      # The .aab is attached as well so the Play upload can be fetched
      # with a plain curl, the way the APK already can. The Actions
      # artifact of the same bundle needs a GitHub token and a browser;
      # this does not. Nothing secret is published by doing so: the
      # bundle holds the same compiled code the APK beside it already
      # does, and the signing key stays in the secrets.
      - name: Publish the APK and app bundle as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message || 'Manual build' }}

            Branch: ${{ github.ref_name }}
          files: |
            mobile/godown_book/build/app/outputs/flutter-apk/storagebill-pro-build-*.apk
            mobile/godown_book/build/app/outputs/bundle/release/storagebill-pro-build-*.aab
          make_latest: true
          fail_on_unmatched_files: true

      - name: Clean up secrets from the runner
        if: always()
        run: rm -f android/godown-book.jks android/key.properties

  # The rules are tested against the Firestore emulator on every push:
  # a company can only reach its own data, entitlements cannot be
  # changed by a client, platform collections are closed to normal
  # users, and a Super Admin (custom claim) reaches what the admin
  # panel needs. Deployment below waits for this to pass.
  firestore-rules-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/godown_book/firestore_tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test firestore.rules on the emulator
        run: npm test

  # The Firestore rules only protect anything once they are deployed,
  # and until then the App ID, subscriptions and signature links all
  # fail quietly. With a service account in the secrets this deploys
  # them on every push to the app; without one it says so and skips.
  firestore-rules:
    runs-on: ubuntu-latest
    needs: [build, firestore-rules-test]
    defaults:
      run:
        working-directory: mobile/godown_book

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy firestore.rules
        env:
          SERVICE_ACCOUNT: ${{ secrets.GODOWN_BOOK_FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.GODOWN_BOOK_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::GODOWN_BOOK_FIREBASE_SERVICE_ACCOUNT / GODOWN_BOOK_FIREBASE_PROJECT_ID are not set; firestore.rules would stay as they are and the app's data would be unprotected."
            exit 1
          fi
          if [ "$PROJECT_ID" != "storagebill-pro" ]; then
            echo "::error::GODOWN_BOOK_FIREBASE_PROJECT_ID is not storagebill-pro; refusing to deploy these rules to another project."
            exit 1
          fi
          # The key is written outside the workspace, so it is never a
          # build input and can never reach an artifact.
          trap 'rm -f "$RUNNER_TEMP/firebase-sa.json"' EXIT
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@15 deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive
          echo "firestore.rules deployed to $PROJECT_ID."
