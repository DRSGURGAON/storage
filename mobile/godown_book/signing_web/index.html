<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Sign document</title>
<style>
  :root {
    --ink: #0b1b2b;
    --muted: #5b6b7c;
    --line: #dfe5ec;
    --brand: #0a2540;
    --accent: #00b5a6;
    --bg: #f3f5f8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  header {
    background: var(--brand);
    color: #fff;
    padding: 18px 16px;
  }
  header .company { font-size: 18px; font-weight: 700; }
  header .doc { font-size: 13px; opacity: .85; margin-top: 2px; }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  h2 { font-size: 15px; margin: 0 0 10px; letter-spacing: .3px; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; gap: 12px; padding: 6px 0; border-bottom: 1px solid #f0f3f6; }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--muted); flex: 0 0 42%; font-size: 14px; }
  .row .v { font-weight: 600; font-size: 14px; }
  ol.terms { margin: 0; padding-left: 20px; font-size: 13px; color: #2b3b4b; }
  ol.terms li { margin-bottom: 6px; }
  label.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin: 4px 0 14px; }
  label.consent input { width: 20px; height: 20px; margin-top: 2px; flex: 0 0 auto; }
  input[type=text] {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px;
  }
  .padwrap { position: relative; }
  canvas {
    width: 100%; height: 200px; display: block;
    background: #fff; border: 1px dashed #b9c4d0; border-radius: 10px; touch-action: none;
  }
  .padhint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9fb0c0; font-size: 14px; pointer-events: none;
  }
  .padhint[hidden] { display: none; }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  button {
    flex: 1; padding: 14px; font-size: 16px; font-weight: 600;
    border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button[disabled] { opacity: .5; }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .state { text-align: center; padding: 48px 20px; }
  .state .big { font-size: 44px; }
  .state h1 { font-size: 20px; margin: 12px 0 6px; }
  .state p { color: var(--muted); margin: 0; }
  .err { color: #c62828; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>

<div id="app">
  <div class="state"><div class="big">⏳</div><h1>Loading…</h1><p>One moment please.</p></div>
</div>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getFirestore, doc, getDoc, updateDoc, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = document.getElementById('app');

const state = (emoji, title, text) => {
  app.innerHTML = `<div class="state"><div class="big">${emoji}</div><h1></h1><p></p></div>`;
  app.querySelector('h1').textContent = title;
  app.querySelector('p').textContent = text;
};

const token = new URLSearchParams(location.search).get('t') || '';
if (!token || !/^[A-Za-z0-9]{16,64}$/.test(token)) {
  state('🔗', 'This link is not complete', 'Please ask for the link again.');
  throw new Error('no token');
}

let db;
try {
  db = getFirestore(initializeApp(window.GODOWN_BOOK_FIREBASE_CONFIG));
} catch (error) {
  state('⚠️', 'This page is not set up yet', 'The signing page needs its Firebase settings.');
  throw error;
}

const ref = doc(db, 'signatureRequests', token);
let data;
try {
  const snapshot = await getDoc(ref);
  data = snapshot.exists() ? snapshot.data() : null;
} catch (error) {
  state('⚠️', 'Could not open the document', 'Please check your internet and try again.');
  throw error;
}

if (!data) {
  state('✅', 'Nothing to sign here', 'This link has already been used, or it was cancelled.');
} else if (data.status === 'SIGNED') {
  state('✅', 'Already signed', 'Thank you. Nothing more is needed.');
} else if (data.expiresAt && data.expiresAt.toDate && data.expiresAt.toDate() < new Date()) {
  state('⌛', 'This link has expired', 'Please ask for a new link.');
} else {
  render(data);
}

function render(d) {
  const details = Array.isArray(d.details) ? d.details : [];
  const terms = String(d.terms || '')
    .split('\n')
    .map((line) => line.trim().replace(/^\d+[.)]\s*/, ''))
    .filter(Boolean);

  app.innerHTML = `
    <header>
      <div class="company"></div>
      <div class="doc"></div>
    </header>
    <div class="wrap">
      <div class="card">
        <h2>Details</h2>
        <div id="details"></div>
      </div>
      ${terms.length ? '<div class="card"><h2>Terms</h2><ol class="terms" id="terms"></ol></div>' : ''}
      <div class="card">
        <h2>Your signature</h2>
        <input type="text" id="name" placeholder="Your name" autocomplete="name">
        <div class="padwrap">
          <canvas id="pad"></canvas>
          <div class="padhint" id="padhint">Sign here with your finger</div>
        </div>
        <div class="actions">
          <button type="button" id="clear">Clear</button>
        </div>
        <div style="height:14px"></div>
        <label class="consent">
          <input type="checkbox" id="consent">
          <span id="consenttext"></span>
        </label>
        <button type="button" class="primary" id="submit" disabled>Sign and send</button>
        <div class="err" id="err" hidden></div>
        <p class="note">
          Your signature and name are sent to the company named above, with
          the date and time. This is an electronic acknowledgement of the
          details shown on this page.
        </p>
      </div>
    </div>`;

  app.querySelector('.company').textContent = d.companyName || 'Storage';
  app.querySelector('.doc').textContent =
    [d.title, d.documentNo].filter(Boolean).join('  •  ');

  const detailsEl = document.getElementById('details');
  for (const detail of details) {
    const row = document.createElement('div');
    row.className = 'row';
    const k = document.createElement('div');
    k.className = 'k';
    k.textContent = detail.label || '';
    const v = document.createElement('div');
    v.className = 'v';
    v.textContent = detail.value || '-';
    row.append(k, v);
    detailsEl.append(row);
  }

  if (terms.length) {
    const list = document.getElementById('terms');
    for (const term of terms) {
      const li = document.createElement('li');
      li.textContent = term;
      list.append(li);
    }
  }

  const nameInput = document.getElementById('name');
  nameInput.value = d.customerName || '';

  document.getElementById('consenttext').textContent =
    d.consentText || 'I confirm the details above are correct and I agree to the terms shown.';

  setupPad(d);
}

function setupPad(d) {
  const canvas = document.getElementById('pad');
  const hint = document.getElementById('padhint');
  const consent = document.getElementById('consent');
  const submit = document.getElementById('submit');
  const err = document.getElementById('err');
  const nameInput = document.getElementById('name');

  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;

  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#111';

  let drawing = false;
  let hasInk = false;
  let last = null;

  const point = (event) => {
    const rect = canvas.getBoundingClientRect();
    const source = event.touches ? event.touches[0] : event;
    return { x: source.clientX - rect.left, y: source.clientY - rect.top };
  };

  const start = (event) => {
    event.preventDefault();
    drawing = true;
    last = point(event);
  };

  const move = (event) => {
    if (!drawing) return;
    event.preventDefault();
    const now = point(event);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(now.x, now.y);
    ctx.stroke();
    last = now;
    if (!hasInk) {
      hasInk = true;
      hint.hidden = true;
      update();
    }
  };

  const end = () => { drawing = false; };

  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', end);

  const update = () => {
    submit.disabled = !(hasInk && consent.checked && nameInput.value.trim().length > 1);
  };

  consent.addEventListener('change', update);
  nameInput.addEventListener('input', update);

  document.getElementById('clear').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasInk = false;
    hint.hidden = false;
    update();
  });

  submit.addEventListener('click', async () => {
    submit.disabled = true;
    submit.textContent = 'Sending…';
    err.hidden = true;

    try {
      await updateDoc(ref, {
        status: 'SIGNED',
        signature: shrink(canvas),
        signerName: nameInput.value.trim(),
        signedAt: serverTimestamp(),
      });

      state('✅', 'Signed. Thank you.',
        `${d.companyName || 'The company'} has received your signature.`);
    } catch (error) {
      submit.disabled = false;
      submit.textContent = 'Sign and send';
      err.hidden = false;
      err.textContent =
        'Could not send the signature. Please check your internet and try again.';
      console.error(error);
    }
  });
}

/// Keeps the image small enough to travel in one document: the blank
/// space around the stroke is trimmed off first, so the signature fills
/// the signature line on the printed document instead of sitting tiny in
/// the middle of an empty box, and the result is at most 600 pixels wide
/// with a transparent background.
function shrink(canvas) {
  const maxWidth = 600;
  const box = inkBounds(canvas);

  const out = document.createElement('canvas');
  const scale = Math.min(1, maxWidth / box.width);
  out.width = Math.max(1, Math.round(box.width * scale));
  out.height = Math.max(1, Math.round(box.height * scale));
  out.getContext('2d').drawImage(
    canvas, box.x, box.y, box.width, box.height, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}

/// The rectangle the stroke actually occupies, with a small margin. Falls
/// back to the whole canvas if anything is unreadable.
function inkBounds(canvas) {
  const whole = { x: 0, y: 0, width: canvas.width, height: canvas.height };
  let pixels;
  try {
    pixels = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
  } catch (error) {
    return whole;
  }

  let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;
  for (let y = 0; y < canvas.height; y++) {
    for (let x = 0; x < canvas.width; x++) {
      if (pixels[(y * canvas.width + x) * 4 + 3] > 12) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return whole;

  const pad = Math.round(Math.max(canvas.width, canvas.height) * 0.02);
  const x = Math.max(0, minX - pad);
  const y = Math.max(0, minY - pad);
  return {
    x,
    y,
    width: Math.min(canvas.width, maxX + pad + 1) - x,
    height: Math.min(canvas.height, maxY + pad + 1) - y,
  };
}
</script>
</body>
</html>
